name: Bug report
description: Something is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Do not include API keys, tokens, or `.env` contents.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g. local bun, Node 22, macOS / or a self-hosted deploy"
  - type: textarea
    id: extra
    attributes:
      label: Extra context
      description: Logs, screenshots, or related PRs. Redact secrets.
